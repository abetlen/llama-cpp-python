name: Build Wheels (Metal)

on: workflow_dispatch

permissions:
  contents: write

jobs:
  build_wheels:
    # Two runners produced the same py3-none wheel filename, which collided
    # when their artifacts were downloaded into one release directory.
    name: Build wheels on macos-14
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      # Used to host cibuildwheel
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies (Linux/MacOS)
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          RUST_LOG=trace python -m uv pip install -e .[all] --verbose
        shell: bash

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          # disable repair
          CIBW_REPAIR_WHEEL_COMMAND: ""
          CIBW_ARCHS: "arm64"
          CIBW_ENVIRONMENT: CMAKE_ARGS="-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_APPLE_SILICON_PROCESSOR=arm64 -DGGML_METAL=on -DCMAKE_CROSSCOMPILING=ON"
          # wheel.py-api = py3 produces one wheel for all supported Python versions.
          CIBW_BUILD: "cp39-*"
        with:
          package-dir: .
          output-dir: wheelhouse2

      - name: Verify wheel archives
        run: python3 scripts/verify-wheel-archives.py --expected-count 1 wheelhouse2/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-mac_macos-14
          path: ./wheelhouse2/*.whl

  release:
    name: Release
    needs: [build_wheels]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: wheels-mac_macos-14
          path: dist2

      - name: Verify release wheel archives
        run: python3 scripts/verify-wheel-archives.py --expected-count 1 dist2/*.whl

      - uses: softprops/action-gh-release@v3
        with:
          files: dist2/*
          # set release name to <tag>-metal
          tag_name: ${{ github.ref_name }}-metal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
